[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempovis-sdk"
version = "0.1.0"
description = "Python SDK for TempoVis — agentic multimodal time series intelligence"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rauf Mughal", email = "rauf.mughal8930@gmail.com" }]
requires-python = ">=3.11"
keywords = ["time-series", "anomaly-detection", "llm", "vision", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/abdulsamad00529/tempovis"
Repository = "https://github.com/abdulsamad00529/tempovis"
Issues = "https://github.com/abdulsamad00529/tempovis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tempovis*"]
