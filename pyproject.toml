[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pycodestyle]
max-line-length = 100

[tool.flake8]
max-line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
